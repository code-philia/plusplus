[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-compiler"
version = "1.2.0"
description = "Agentic Requirement Compiler"
requires-python = ">=3.11"
dependencies = [
  "requests",
  "python-dotenv",
  "pyyaml",
  "colorama",
]

[project.scripts]
arc = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "app_type_handler",
  "app_type_handler.*",
  "arcbench_agent_runtime",
  "arcbench_agent_runtime.*",
  "compiler",
  "compiler.*",
  "core",
  "core.*",
]
